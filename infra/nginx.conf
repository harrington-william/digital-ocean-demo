# Reverse proxy for the Next.js app (`next start`, default port 3000).
# Install on the droplet as /etc/nginx/sites-available/digitalocean, then:
#   sudo ln -s /etc/nginx/sites-available/digitalocean /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Forward the original request info to Next.js.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (HMR in dev, any app-level websocket usage).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Next.js can stream responses (loading UI, PPR); don't buffer them.
        proxy_buffering off;
    }
}
